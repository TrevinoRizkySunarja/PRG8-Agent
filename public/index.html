<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent P</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar">
        <div class="profile">
          <div class="avatar" aria-hidden="true">P</div>
          <div>
            <h1>Agent P</h1>
            <p>Studie-assistent met documenten en tools</p>
          </div>
        </div>

        <section class="panel">
          <h2>Status</h2>
          <dl id="statusList">
            <div><dt>Model</dt><dd>laden...</dd></div>
            <div><dt>Documentstukken</dt><dd>laden...</dd></div>
          </dl>
          <button id="newChatButton" class="secondary" type="button">Nieuwe chat</button>
        </section>

        <section class="panel">
          <h2>Document toevoegen</h2>
          <label>
            Titel
            <input id="docTitle" type="text" placeholder="Bijvoorbeeld: opdrachtcriteria">
          </label>
          <label>
            Tekst
            <textarea id="docText" rows="7" placeholder="Plak hier tekst uit een opdracht of document."></textarea>
          </label>
          <button id="saveDocButton" type="button">Document opslaan</button>
          <p id="docMessage" class="muted"></p>
        </section>
      </aside>

      <section class="chatArea">
        <div id="messages" class="messages" aria-live="polite"></div>
        <form id="chatForm" class="composer">
          <input id="messageInput" type="text" autocomplete="off" placeholder="Vraag iets aan Agent P..." required>
          <button type="submit">Stuur</button>
        </form>
      </section>
    </main>

    <template id="messageTemplate">
      <article class="message">
        <div class="bubble"></div>
        <div class="meta"></div>
      </article>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
